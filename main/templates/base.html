<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="E-Queue - інтелектуальна система розподілу черг для навчальних закладів">
    <title>{% block title %}E-Queue{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" defer>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}" defer>
    <link rel="stylesheet" href="{% static 'css/queues.css' %}" defer>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom">
        <div class="container-lg">
            <a class="navbar-brand fw-bold fs-4" href="/">E-Queue</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="Меню">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Головна</a></li>
                    <li class="nav-item">
                    <a class="nav-link" href="{% url 'calendar' %}">Календар</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="/queues/">Черги</a></li>
                    {% if user.is_authenticated %}
                        <li class="nav-item dropdown" id="nav-auth">
                            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                 {{ user.username }}
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                                <li><a class="dropdown-item" href="/profile/">Профіль</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form method="post" action="/logout/" style="margin:0;">
                                        {% csrf_token %}
                                        <button type="submit" class="dropdown-item">Вихід</button>
                                    </form>
                                </li>
                            </ul>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="/register-page/">Реєстрація</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/login/">Вхід</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
    {% load static %}
    <script src="{% static 'js/app.js' %}" defer></script>
    <script src="{% static 'js/register.js' %}" defer></script>
    <script src="{% static 'js/login.js' %}" defer></script>
</body>
</html>
