{% extends 'base.html' %}
{% block title %}Реєстрація - E-Queue{% endblock %}
{% block content %}

<section class="register-section">
    <div class="container d-flex justify-content-center">
        <div class="register-card">
            <h2 class="text-center mb-4">Реєстрація</h2>
            <form id="registerForm">


                <div class="mb-3">
                    <label for="username" class="form-label">Ім'я користувача</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="phone_number" class="form-label">Номер телефону</label>
                    <div class="input-wrapper">
                        <span class="input-icon">📞</span>
                        <input type="tel" class="form-control" id="phone_number" name="phone_number" placeholder="+380XXXXXXXXX">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password2" class="form-label">Підтвердіть пароль</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" class="form-control" id="password2" name="password2" required>
                    </div>
                </div>
                <div id="errorMessage" class="alert alert-danger d-none"></div>
                <div id="successMessage" class="alert alert-success d-none"></div>
                <button type="submit" class="btn btn-primary w-100">Зареєструватися</button>
               <p class="text-center mt-3">
                    Вже є акаунт? <a href="{% url 'login_page' %}" class="fw-bold">Увійти</a>
               </p>
            </form>
        </div>
    </div>
</section>

{% endblock %}
