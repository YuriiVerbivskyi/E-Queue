{% extends 'base.html' %}

{% block title %}Мій Профіль - E-Queue{% endblock %}

{% block content %}
<section class="register-section">
    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        <div class="register-card profile-card" style="max-width: 500px;">

            <div class="text-center mb-4 profile-header">
                <div class="profile-avatar"></div>
                <h2 class="profile-title">Мій Профіль</h2>
            </div>

            <div id="profile-info">

                <div class="mb-4">
                    <label class="form-label">👤 Ім'я користувача</label>
                    <div class="input-wrapper">
                        <input type="text" class="form-control" id="profile-username" disabled value="{{ profile_username }}">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">✉️ Email</label>
                    <div class="input-wrapper">
                        <input type="email" class="form-control profile-email" id="profile-email" disabled value="{{ profile_email }}">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Номер телефону</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone input-icon" style="color: #667eea;"></i>
                        <input type="text" class="form-control" id="profile-phone" disabled value="{{ profile_phone }}">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Роль</label>
                    <div class="input-wrapper">
                        <input type="text" class="form-control" id="profile-role" disabled value="{{ profile_role }}">
                    </div>
                </div>

            </div>

            <form method="post" action="/logout/" style="width: 100%;">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100 mt-4">
                    Вийти
                </button>
            </form>

        </div>
    </div>
</section>
{% endblock %}
